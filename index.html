<style>
@page { size: letter landscape; margin: 0.2in; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

:root {
  --att-blue: #0057B8;
  --att-cyan: #0284C7;
  --emerald: #059669;
  --text-primary: #0F172A;
  --text-secondary: #334155;
  --text-muted: #586A82;
  --sky-50: #F0F9FF;
  --sky-200: #BAE6FD;
  --sky-300: #7DD3FC;
  --blue-50: #EFF6FF;
  --line: #BFDBFE;
  if (c.cmd) { c.cmd(); return; }
  if (!slot) return;
  if (c.multi) { if (AG.sel.has(c.v)) AG.sel.delete(c.v); else AG.sel.add(c.v); c.on = AG.sel.has(c.v); agDrawChips(AG.chips, i); return; }
  if (c.done) { const names = AG.chips.filter((x) => x.multi && x.on).map((x) => x.t); agPick(slot, [...AG.sel], names.length ? names.join(', ') : 'Nothing'); return; }
  agPick(slot, c.v, c.t);
}
function agAsk(slot) {
  AG.cur = slot.id; AG.finished = false; AG.sel = new Set();
  const q = slot.ask();
  agSay('bot', q.q);
  if (q.select) agSelect(q.select.label, q.select.options, (v, t) => agPick(slot, v, t));
  else agDrawChips(q.chips);
}
function agNext() {
  const s = SLOTS.find((x) => x.applies() && !AG.got[x.id]);
  if (s) agAsk(s); else agFinish();
}
function agStart(quiet) {
  AG.started = true;
  if (parseFloat($('curr-total').value) > 0) AG.got.bill = true;
  if (!quiet) agNext();
}
function agRestart() {
  AG.got = {}; AG.cur = null;
  agSay('bot', "Starting the questions again. Answers already in the quote stay until you change them.");
  agStart();
}
function agCustomerView() { if (!document.body.classList.contains('presentation-mode')) togglePres(); }
function agCopy() { actions['copy-sms'](); }
function agChange() {
  const list = SLOTS.filter((s) => AG.got[s.id] && s.applies()).map((s) => ({ t: s.label, cmd: () => { agSay('me', 'Change ' + s.label.toLowerCase()); AG.got[s.id] = false; agNext(); } }));
  agSay('bot', 'Which answer do you want to change?');
  agDrawChips(list);
}
function agCommand(t) {
  if (/\b(start over|restart|begin again)\b/.test(t)) { agRestart(); return true; }
    row('ar-nums', usd(c.newTotal) + '/mo');
    row('ar-sub', 'Add the current bill to see the savings.');
  }
  row('ar-sub', 'Due today ' + usd(c.isBiz ? 0 : c.due) + '. First bill ' + usd(c.firstBill) + '.');
  const suggest = hasBill && !$('check-hotspot').checked && c.recIdx !== c.selIdx && c.planCosts[c.recIdx] <= c.baseline;
  if (suggest) row('ar-sug', 'Suggested: ' + c.planTitles[c.recIdx] + ' at ' + usd(c.planCosts[c.recIdx]) + '/mo, which saves ' + usd(c.baseline - c.planCosts[c.recIdx]) + '/mo.');
  agSay('bot', '', null, box);
  const chips = [];
  if (suggest) chips.push({ t: 'Switch to suggested plan', primary: true, cmd: () => { agSay('me', 'Switch to suggested plan'); selectPlan(lastCalc.recIdx); agFinish(); } });
  chips.push({ t: 'Show Customer View', cmd: agCustomerView }, { t: 'Copy quote', cmd: agCopy }, { t: 'Change an answer', cmd: agChange });
  AG.finishChips = chips;
  agDrawChips(chips);
}

function agInit() {
  const form = $('agent-form'), input = $('agent-input');
  form.addEventListener('submit', (e) => { e.preventDefault(); const v = input.value; input.value = ''; agText(v); });
  $('agent-chips').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (b) agChipClick(parseInt(b.dataset.i, 10)); });
  $('agent-restart').addEventListener('click', agRestart);
  agSay('bot', 'Describe the account in your own words, like "4 lines, $240 on debit, wants an iPhone 17". Or I can ask the questions one at a time. The quote re-rates after every answer.');
  agDrawChips([{ t: 'Ask me the questions', primary: true, cmd: () => { agSay('me', 'Ask me the questions'); agStart(); } }]);
}

/* ============================== INIT ============================== */
syncSegmentUI();     // 1. populate discount options first
restoreState();      // 2. restore saved / shared quote (validated)
syncHardwareLedger();// 3. render attached hardware
runCalc();           // 4. compute everything
agInit();            // 5. quote assistant greeting
})();
</script>
</body>
